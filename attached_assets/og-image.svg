<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A1 Tradelines authorized user tradelines</title>
  <desc id="desc">A1 Tradelines social preview image with authorized user tradelines message.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#39ff14" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#030403" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#9b9b9b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="14" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#39ff14" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#030403"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="24" y="24" width="1152" height="582" rx="30" fill="none" stroke="#39ff14" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(40 35) scale(.56)" filter="url(#shadow)">
    <text x="95" y="560" font-family="Arial Black, Impact, sans-serif" font-size="650" font-weight="900" fill="#050505" stroke="#202020" stroke-width="34">A1</text>
    <text x="75" y="535" font-family="Arial Black, Impact, sans-serif" font-size="650" font-weight="900" fill="url(#chrome)" stroke="#0b0b0b" stroke-width="24">A1</text>
    <text x="75" y="535" font-family="Arial Black, Impact, sans-serif" font-size="650" font-weight="900" fill="none" stroke="#777" stroke-width="8">A1</text>
    <rect x="85" y="610" width="1030" height="170" rx="14" fill="url(#bar)" stroke="#8a8a8a" stroke-width="8"/>
    <text x="600" y="735" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="155" font-weight="900" fill="#39ff14" filter="url(#greenGlow)">TRADELINES</text>
  </g>
  <g transform="translate(560 130)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#d8e3dc" letter-spacing="4">AUTHORIZED USER</text>
    <text x="0" y="70" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" fill="#39ff14">TRADELINES</text>
    <text x="0" y="148" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#f3f7f4">Compare live options by bank,</text>
    <text x="0" y="188" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#f3f7f4">age, limit, timing, and price.</text>
    <text x="0" y="258" font-family="Inter, Arial, sans-serif" font-size="20" fill="#aeb8b2">No credit score, approval, or funding outcome is guaranteed.</text>
    <rect x="0" y="305" width="430" height="70" rx="18" fill="#39ff14"/>
    <text x="215" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#030403">A1Tradelines.com</text>
  </g>
