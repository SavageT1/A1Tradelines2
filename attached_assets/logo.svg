<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A1 Tradelines logo</title>
  <desc id="desc">A1 Tradelines brand mark in white, black, chrome, and neon green.</desc>
  <defs>
    <linearGradient id="chrome" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#9b9b9b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="18" dy="22" stdDeviation="18" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#39ff14" flood-opacity="0.75"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="transparent"/>
  <g filter="url(#shadow)">
    <text x="95" y="560" font-family="Arial Black, Impact, sans-serif" font-size="650" font-weight="900" fill="#050505" stroke="#202020" stroke-width="34">A1</text>
    <text x="75" y="535" font-family="Arial Black, Impact, sans-serif" font-size="650" font-weight="900" fill="url(#chrome)" stroke="#0b0b0b" stroke-width="24">A1</text>
    <text x="75" y="535" font-family="Arial Black, Impact, sans-serif" font-size="650" font-weight="900" fill="none" stroke="#6b6b6b" stroke-width="8">A1</text>
  </g>
  <g>
    <rect x="85" y="610" width="1030" height="170" rx="14" fill="url(#bar)" stroke="#8a8a8a" stroke-width="8"/>
    <text x="600" y="735" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="155" font-weight="900" fill="#39ff14" filter="url(#greenGlow)">TRADELINES</text>
  </g>
</svg>
